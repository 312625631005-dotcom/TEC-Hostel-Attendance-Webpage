<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hostel Attendance</title>
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --text:#16202a; --sub:#647385; --line:#e3e8ee;
  --accent:#1e3a5f; --accent2:#b8912f; --green:#16a34a; --red:#dc2626; --yellow:#ca8a04;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1418; --card:#1a2129; --text:#e8edf2; --sub:#93a2b3; --line:#2a333d;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1418; --card:#1a2129; --text:#e8edf2; --sub:#93a2b3; --line:#2a333d;
}
body.theme-boys{ --accent:#1e3a5f; --accent2:#b8912f; }
body.theme-girls{ --accent:#7a1f3d; --accent2:#c98a4b; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
header{position:sticky;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;background:var(--accent);color:#fff;z-index:5;transition:background .25s}
.headtop{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.headtop img{width:42px;height:42px;border-radius:8px;background:#fff;object-fit:contain;padding:2px;flex-shrink:0}
.headtext{min-width:0}
.cname{font-size:14px;font-weight:800;line-height:1.2}
.caddr{font-size:10.5px;opacity:.85;margin-top:1px}
.hostelSwitch{display:flex;gap:6px;padding-bottom:10px}
.hostelSwitch button{flex:1;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:700}
.hostelSwitch button.active{background:var(--accent2);border-color:var(--accent2);color:#1a1a1a}
.sectiontitle{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 10px 2px}
main{padding:12px 12px 80px;max-width:640px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;padding:10px}
.stat .n{font-size:24px;font-weight:800}
.stat .l{font-size:12px;color:var(--sub)}
h2{font-size:14px;margin:0 0 10px;color:var(--sub);text-transform:uppercase;letter-spacing:.03em}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
button{font-size:14px;border:none;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;width:100%}
.btn-ghost{background:var(--line);color:var(--text)}
.room-title{font-weight:700;font-size:13px;color:var(--sub);margin:14px 0 6px;padding-top:4px}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.sinfo{flex:1;min-width:0}
.sname{font-weight:600;font-size:14px}
.smeta{font-size:12px;color:var(--sub)}
.statusbtns{display:flex;gap:5px}
.sbtn{width:38px;height:38px;border-radius:9px;font-size:16px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.sbtn.p.on{background:var(--green);color:#fff;border-color:var(--green)}
.sbtn.a.on{background:var(--red);color:#fff;border-color:var(--red)}
.sbtn.l.on{background:var(--yellow);color:#fff;border-color:var(--yellow)}
.toprow{display:flex;gap:8px;margin-bottom:10px}
.toprow>*{flex:1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--text);border-radius:0}
.seg button.active{background:var(--accent);color:#fff}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{flex:1;background:transparent;color:var(--sub);border-radius:0;padding:10px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px}
nav.tabs button.active{color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:24px 10px;font-size:13px}
.rowline{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border:none}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--sub)}
.view{display:none}
.view.active{display:block}
</style>
</head>

<main>
<div class="sectiontitle" id="pageTitle">Dashboard</div>

<section id="v-dash" class="view active">
  <div class="grid2">
    <div class="card stat"><div class="n" id="d-total">0</div><div class="l">Students</div></div>
    <div class="card stat"><div class="n" id="d-rooms">0</div><div class="l">Rooms</div></div>
  </div>
  <div class="card">
    <h2>Today · Morning</h2>
    <div class="grid2">
      <div class="stat"><div class="n" id="m-p" style="color:var(--green)">0</div><div class="l">Present</div></div>
      <div class="stat"><div class="n" id="m-a" style="color:var(--red)">0</div><div class="l">Absent</div></div>
    </div>
  </div>
  <div class="card">
    <h2>Today · Evening</h2>
    <div class="grid2">
      <div class="stat"><div class="n" id="e-p" style="color:var(--green)">0</div><div class="l">Present</div></div>
      <div class="stat"><div class="n" id="e-a" style="color:var(--red)">0</div><div class="l">Absent</div></div>
    </div>
  </div>
</section>

<section id="v-students" class="view">
  <div class="card">
    <h2>Add Student</h2>
    <label>Name</label><input id="f-name" placeholder="Student name">
    <label>Register No.</label><input id="f-reg" placeholder="e.g. 31262401001">
    <div class="grid2">
      <div><label>Department</label><input id="f-dept" placeholder="CSE"></div>
      <div><label>Year</label><input id="f-year" placeholder="III"></div>
    </div>
    <label>Room No.</label><input id="f-room" placeholder="A-101">
    <button class="btn-primary" style="margin-top:10px" onclick="addStudent()">Add Student</button>
  </div>
  <div class="card"><h2>All Students (by Room)</h2><div id="studentList"></div></div>
</section>

<section id="v-att" class="view">
  <div class="card">
    <div class="toprow">
      <div><label>Date</label><input type="date" id="att-date"></div>
      <div><label>Session</label>
        <div class="seg"><button id="seg-m" onclick="setSession('MORNING')">Morning</button><button id="seg-e" onclick="setSession('EVENING')">Evening</button></div>
      </div>
    </div>
    <button class="btn-ghost" style="width:100%" onclick="markAllPresent()">✅ Mark All Present</button>
  </div>
  <div id="attList"></div>
</section>

<section id="v-report" class="view">
  <div class="card">
    <div class="toprow">
      <div><label>Date</label><input type="date" id="rep-date"></div>
      <div><label>Session</label>
        <div class="seg"><button id="rseg-m" onclick="setRepSession('MORNING')">Morning</button><button id="rseg-e" onclick="setRepSession('EVENING')">Evening</button></div>
      </div>
    </div>
  </div>
  <div class="card">
    <h2>Summary</h2>
    <div class="rowline"><span>Total</span><b id="r-total">0</b></div>
    <div class="rowline"><span>Present</span><b id="r-p" style="color:var(--green)">0</b></div>
    <div class="rowline"><span>Absent</span><b id="r-a" style="color:var(--red)">0</b></div>
    <div class="rowline"><span>Leave</span><b id="r-l" style="color:var(--yellow)">0</b></div>
    <div class="rowline"><span>Attendance %</span><b id="r-pct">0%</b></div>
  </div>

  <button class="active" onclick="showView('dash',this)"><span class="ic">🏠</span>Dashboard</button>
  <button onclick="showView('students',this)"><span class="ic">👨‍🎓</span>Students</button>
  <button onclick="showView('att',this)"><span class="ic">📋</span>Attendance</button>
  <button onclick="showView('report',this)"><span class="ic">📊</span>Reports</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let downloadsCap = null;
(async()=>{ try{ downloadsCap = await claude.use("downloads"); }catch(e){} })();

let DB = {students:[], attendance:{}};
try{ const raw = localStorage.getItem('hostel_db'); if(raw) DB = JSON.parse(raw); }catch(e){}
DB.students.forEach(s=>{ if(!s.hostel) s.hostel='Boys'; });
function save(){ try{ localStorage.setItem('hostel_db', JSON.stringify(DB)); }catch(e){} }
function todayStr(){ return new Date().toISOString().slice(0,10); }
let curSession='MORNING', repSession='MORNING';
let curHostel='Boys';
try{ curHostel = localStorage.getItem('hostel_view') || 'Boys'; }catch(e){}

function setHostel(h){
  curHostel = h;
  try{ localStorage.setItem('hostel_view', h); }catch(e){}
  document.body.className = h==='Boys' ? 'theme-boys' : 'theme-girls';
  document.getElementById('hs-Boys').classList.toggle('active', h==='Boys');
  document.getElementById('hs-Girls').classList.toggle('active', h==='Girls');
  const cur = document.getElementById('pageTitle').textContent.split(' · ')[0];
  document.getElementById('pageTitle').textContent = cur + ' · ' + h + ' Hostel';
  refreshCurrentView();
}
function refreshCurrentView(){
  const shown = document.querySelector('.view.active').id.replace('v-','');
  if(shown==='dash') renderDash();
  if(shown==='students') renderStudents();
  if(shown==='att') renderAttendance();
  if(shown==='report') renderReport();
}
function inHostel(){ return DB.students.filter(s=>s.hostel===curHostel); }

function showView(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('v-'+name).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const titles={dash:'Dashboard',students:'Students',att:'Attendance',report:'Reports'};
  document.getElementById('pageTitle').textContent = titles[name] + ' · ' + curHostel + ' Hostel';
  if(name==='dash') renderDash();
  if(name==='students') renderStudents();
  if(name==='att') renderAttendance();
  if(name==='report') renderReport();
}

function addStudent(){
  const name=document.getElementById('f-name').value.trim();
  const reg=document.getElementById('f-reg').value.trim();
  const dept=document.getElementById('f-dept').value.trim();
  const year=document.getElementById('f-year').value.trim();
  const room=document.getElementById('f-room').value.trim();
  if(!name || !room){ alert('Name and Room are required'); return; }
  DB.students.push({id:Date.now().toString(36), name, reg, dept, year, room, hostel:curHostel});
  save();
  ['f-name','f-reg','f-dept','f-year','f-room'].forEach(id=>document.getElementById(id).value='');
  renderStudents();
}
function deleteStudent(id){
  if(!confirm('Remove this student?')) return;
  DB.students = DB.students.filter(s=>s.id!==id); save(); renderStudents();
}
function byRoom(list){
  const rooms={};
  list.forEach(s=>{ (rooms[s.room||'Unassigned'] ??= []).push(s); });
  return Object.keys(rooms).sort().map(r=>({room:r, students:rooms[r]}));
}
function renderStudents(){
  const el=document.getElementById('studentList');
  const list = inHostel();
  if(!list.length){ el.innerHTML='<div class="empty">No students yet in the '+curHostel+' Hostel. Add your first one above.</div>'; return; }
  let html='';
  byRoom(list).forEach(g=>{
    html += `<div class="room-title">Room ${g.room} (${g.students.length})</div>`;
    g.students.forEach(s=>{
      html += `<div class="srow"><div class="sinfo"><div class="sname">${s.name}</div><div class="smeta">${s.reg||''} · ${s.dept||''} ${s.year||''}</div></div><button class="btn-ghost" style="padding:8px 10px" onclick="deleteStudent('${s.id}')">✕</button></div>`;
    });
  });
  el.innerHTML = html;
}

function setSession(s){ curSession=s; document.getElementById('seg-m').classList.toggle('active',s==='MORNING'); document.getElementById('seg-e').classList.toggle('active',s==='EVENING'); renderAttendance(); }
function key(date,session,id){ return date+'_'+session+'_'+id; }
function markAllPresent(){
  const date=document.getElementById('att-date').value || todayStr();
  inHostel().forEach(s=>{ DB.attendance[key(date,curSession,s.id)] = 'PRESENT'; });
  save(); renderAttendance();
}
function setStatus(id, status){
  const date=document.getElementById('att-date').value || todayStr();
  DB.attendance[key(date,curSession,id)] = status;
  save(); renderAttendance();
}
function renderAttendance(){
  const dateEl=document.getElementById('att-date');
  if(!dateEl.value) dateEl.value=todayStr();
  dateEl.onchange = renderAttendance;
  document.getElementById('seg-m').classList.toggle('active',curSession==='MORNING');
  document.getElementById('seg-e').classList.toggle('active',curSession==='EVENING');
  const date=dateEl.value;
  const el=document.getElementById('attList');
  const list = inHostel();
  if(!list.length){ el.innerHTML='<div class="empty">Add students to the '+curHostel+' Hostel first from the Students tab.</div>'; return; }
  let html='';
  byRoom(list).forEach(g=>{
    html += `<div class="room-title">Room ${g.room}</div>`;
    g.students.forEach(s=>{
      const st = DB.attendance[key(date,curSession,s.id)] || '';
      html += `<div class="srow"><div class="sinfo"><div class="sname">${s.name}</div><div class="smeta">${s.dept||''} ${s.year||''}</div></div>
        <div class="statusbtns">
          <button class="sbtn p ${st==='PRESENT'?'on':''}" onclick="setStatus('${s.id}','PRESENT')">🟢</button>
          <button class="sbtn a ${st==='ABSENT'?'on':''}" onclick="setStatus('${s.id}','ABSENT')">🔴</button>
          <button class="sbtn l ${st==='LEAVE'?'on':''}" onclick="setStatus('${s.id}','LEAVE')">🟡</button>
        </div></div>`;
    });
  });
  el.innerHTML = html;
}

function setRepSession(s){ repSession=s; renderReport(); }
function renderReport(){
  const dateEl=document.getElementById('rep-date');
  if(!dateEl.value) dateEl.value=todayStr();
  dateEl.onchange = renderReport;
  document.getElementById('rseg-m').classList.toggle('active',repSession==='MORNING');
  document.getElementById('rseg-e').classList.toggle('active',repSession==='EVENING');
  const date=dateEl.value;
  let p=0,a=0,l=0; const flagged=[];
  const list=inHostel();
  list.forEach(s=>{
    const st=DB.attendance[key(date,repSession,s.id)];
    if(st==='PRESENT') p++; else if(st==='ABSENT'){a++; flagged.push({...s,st});} else if(st==='LEAVE'){l++; flagged.push({...s,st});}
  });
  const total=list.length;
  document.getElementById('r-total').textContent=total;
  document.getElementById('r-p').textContent=p;
  document.getElementById('r-a').textContent=a;
  document.getElementById('r-l').textContent=l;
  document.getElementById('r-pct').textContent= total? Math.round((p/total)*100)+'%' : '0%';
  const listEl=document.getElementById('r-list');
  listEl.innerHTML = flagged.length ? flagged.map(s=>`<div class="rowline"><span>${s.name} · Room ${s.room}</span><span class="pill">${s.st}</span></div>`).join('') : '<div class="empty">No absentees or leaves recorded.</div>';
}

async function exportReport(fmt){
  const date = document.getElementById('rep-date').value || todayStr();
  const session = repSession;
  const rows = [['S.No','Register No','Name','Department','Year','Room','Status','Date','Session']];
  let p=0,a=0,l=0,blank=0;
  const list = inHostel();
  byRoom(list).forEach(g=>{
    g.students.forEach(s=>{
      const st = DB.attendance[key(date,session,s.id)] || 'NOT MARKED';
      if(st==='PRESENT')p++; else if(st==='ABSENT')a++; else if(st==='LEAVE')l++; else blank++;
      rows.push([rows.length, s.reg||'', s.name, s.dept||'', s.year||'', s.room||'', st, date, session]);
    });
  });
  const total = list.length;
  const pct = total ? ((p/total)*100).toFixed(2)+'%' : '0%';

  if(!list.length){ alert('Add students to the '+curHostel+' Hostel first.'); return; }

  if(fmt==='csv'){
    let summary = [
      ['THANGAVELU ENGINEERING COLLEGE'],
      ['OMR, Karapakkam, Chennai - 600097'],
      [curHostel + ' HOSTEL ATTENDANCE REPORT'],
      ['Date', date],['Session', session],
      ['Total Students', total],['Present', p],['Absent', a],['Leave', l],['Not Marked', blank],
      ['Attendance %', pct], []
    ];
    const csvRows = [...summary, ...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    await doSave(`${curHostel}_Hostel_Attendance_${date}_${session}.csv`, new Blob([csvRows], {type:'text/csv'}));
    return;
  }

  // xlsx
  const wb = XLSX.utils.book_new();
  const summarySheetData = [
    ['THANGAVELU ENGINEERING COLLEGE'],
    ['OMR, Karapakkam, Chennai - 600097'],
    [curHostel + ' HOSTEL ATTENDANCE REPORT'],
    ['Date', date],
    ['Session', session],
    ['Total Students', total],
    ['Present', p],
    ['Absent', a],
    ['Leave', l],
    ['Not Marked', blank],
    ['Attendance %', pct]
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(summarySheetData);
  XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');
  const wsDetail = XLSX.utils.aoa_to_sheet(rows);
  wsDetail['!cols'] = [{wch:6},{wch:16},{wch:20},{wch:12},{wch:8},{wch:10},{wch:12},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb, wsDetail, 'Detail');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  await doSave(`${curHostel}_Hostel_Attendance_${date}_${session}.xlsx`, new Blob([wbout], {type:'application/octet-stream'}));
}

async function doSave(filename, blob){
  if(!downloadsCap){ alert('Downloads are not available in this view.'); return; }
  try{
    await downloadsCap.save({filename, data: blob});
  }catch(e){
    if(e && e.code === 'declined') return;
    alert('Could not save file: ' + (e && e.message ? e.message : 'unknown error'));
  }
}

function renderDash(){
  const list = inHostel();
  document.getElementById('d-total').textContent = list.length;
  document.getElementById('d-rooms').textContent = new Set(list.map(s=>s.room)).size;
  const date=todayStr();
  let mp=0,ma=0,ep=0,ea=0;
  list.forEach(s=>{
    const m=DB.attendance[key(date,'MORNING',s.id)], e=DB.attendance[key(date,'EVENING',s.id)];
    if(m==='PRESENT')mp++; if(m==='ABSENT')ma++;
    if(e==='PRESENT')ep++; if(e==='ABSENT')ea++;
  });
  document.getElementById('m-p').textContent=mp; document.getElementById('m-a').textContent=ma;
  document.getElementById('e-p').textContent=ep; document.getElementById('e-a').textContent=ea;
}

// init on load: apply saved hostel theme + title
document.body.className = curHostel==='Boys' ? 'theme-boys' : 'theme-girls';
document.getElementById('hs-Boys').classList.toggle('active', curHostel==='Boys');
document.getElementById('hs-Girls').classList.toggle('active', curHostel==='Girls');
document.getElementById('pageTitle').textContent = 'Dashboard · ' + curHostel + ' Hostel';
renderDash();
</script>
